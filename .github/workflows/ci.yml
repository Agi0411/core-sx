name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # macOS: the MIDI module is a native add-on and Core SX targets macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run parser:verify
      - run: npm run test:fx
      - run: npm run build
