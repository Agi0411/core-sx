name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Core SX version
      description: Shown in the title bar
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "macOS 15.2, Apple Silicon"
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: SPD-SX connection
      options:
        - Not connected
        - WAVE MGR mode
        - AUDIO/MIDI mode
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What did you expect, and what happened instead?"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs (optional)
